---
# InfraEnv for fiesta SNO cluster
# This defines the discovery ISO and infrastructure environment
# Reference: https://docs.redhat.com/en/documentation/red_hat_advanced_cluster_management_for_kubernetes/2.13/html-single/multicluster_engine_operator_with_red_hat_advanced_cluster_management/index#ibio-intro

apiVersion: agent-install.openshift.io/v1beta1
kind: InfraEnv
metadata:
  name: fiesta
  namespace: fiesta
  labels:
    cluster: fiesta
    site: cars2-lab
    networkType: dhcp
spec:
  # Pull secret for accessing Red Hat registries
  pullSecretRef:
    name: assisted-deployment-pull-secret

  # SSH public key for accessing discovery agent
  sshAuthorizedKey: "ssh-rsa "

  # Additional NTP sources for time synchronization during discovery
  additionalNTPSources:
    - clock.cars2.lab
    - clock-v6.cars2.lab

  # CPU architecture
  cpuArchitecture: x86_64

  # Network configuration for the discovery ISO
  # This will be applied when the server boots from the ISO
  nmStateConfigLabelSelector:
    matchLabels:
      cluster: fiesta

---
# NMStateConfig for fiesta node
# Defines the network configuration for the discovery agent
# This ensures the server has network connectivity during discovery

apiVersion: agent-install.openshift.io/v1beta1
kind: NMStateConfig
metadata:
  name: fiesta-nmstate
  namespace: fiesta
  labels:
    cluster: fiesta
spec:
  config:
    interfaces:
      - name: eno3
        type: ethernet
        state: up
        mac-address: "3c:ec:ef:b6:ce:12"
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: 192.168.38.144
              prefix-length: 26
        ipv6:
          enabled: true
          dhcp: false
          address:
            - ip: 2600:52:7:300::144
              prefix-length: 64

    dns-resolver:
      config:
        server:
          - 192.168.38.12
          - 2600:52:7:38::12

    routes:
      config:
        - destination: 0.0.0.0/0
          next-hop-address: 192.168.38.129
          next-hop-interface: eno3
          table-id: 254
        - destination: ::/0
          next-hop-address: 2600:52:7:300::1
          next-hop-interface: eno3
          table-id: 254

  interfaces:
    - name: eno3
      macAddress: "3c:ec:ef:b6:ce:12"

---
# Summary:
# ==========
#
# This InfraEnv configuration:
# 1. Creates a standalone discovery ISO (not tied to specific ClusterInstance)
# 2. ACM automatically uses the latest available RHCOS ISO
# 3. Provides SSH access to the discovery ISO
# 4. Configures dual-stack networking (IPv4/IPv6) via NMStateConfig
# 5. Sets up NTP for time synchronization
#
# The InfraEnv will:
# - Generate a discovery ISO with embedded agent
# - Provide an ISO download URL for BMC mounting
# - Boot the server into a discovery agent
# - The agent will report hardware inventory to ACM
# - Once ClusterInstance is applied, agent is matched (via MAC) and installation begins
#
# To apply:
#   oc apply -f infraenv-fiesta.yaml
#
# To check status:
#   oc get infraenv fiesta -n du1-1-fiesta-cars2-lab
#   oc describe infraenv fiesta -n du1-1-fiesta-cars2-lab
#   oc get nmstateconfig fiesta-nmstate -n du1-1-fiesta-cars2-lab
#
# To get ISO URL:
#   oc get infraenv fiesta -n du1-1-fiesta-cars2-lab -o jsonpath='{.status.isoDownloadURL}'
