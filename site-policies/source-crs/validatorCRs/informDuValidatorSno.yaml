# SNO-specific DU validator — replaces informDuValidator.yaml for single-node deployments.
# Uses 'master' MCP instead of PGT $mcp token.
# Note: ztp-deploy-wave annotation removed from MCP objectDefinition — it is NOT present
# on the cluster-managed master MCP and would cause musthave compliance failure.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfigPool
metadata:
  name: master
status:
  conditions:
    - type: Updated
      status: "True"
    - type: Updating
      status: "False"
  degradedMachineCount: 0
  unavailableMachineCount: 0
  configuration:
    source:
      - apiVersion: machineconfiguration.openshift.io/v1
        kind: MachineConfig
        name: 50-performance-openshift-node-performance-profile
      - apiVersion: machineconfiguration.openshift.io/v1
        kind: MachineConfig
        name: 50-nto-master
---
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetworkNodeState
metadata:
  namespace: openshift-sriov-network-operator
status:
  syncStatus: Succeeded
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: linuxptp-daemon
  namespace: openshift-ptp
