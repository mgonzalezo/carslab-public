---
apiVersion: agent-install.openshift.io/v1beta1
kind: AgentServiceConfig
metadata:
  name: agent
  namespace: multicluster-engine
spec:
  databaseStorage:
    storageClassName: lso-filesystemclass
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi

  filesystemStorage:
    storageClassName: lso-filesystemclass
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi

  imageStorage:
    storageClassName: lso-filesystemclass
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 50Gi

  osImages:
    - cpuArchitecture: x86_64
      openshiftVersion: "4.18"
      version: "4.18.23"
      url: https://mirror.openshift.com/pub/openshift-v4/dependencies/rhcos/4.18/4.18.23/rhcos-4.18.23-x86_64-live.x86_64.iso
      rootFSUrl: https://mirror.openshift.com/pub/openshift-v4/dependencies/rhcos/4.18/4.18.23/rhcos-4.18.23-x86_64-live-rootfs.x86_64.img
    - cpuArchitecture: x86_64
      openshiftVersion: "4.20"
      version: "4.20.13"
      url: https://mirror.openshift.com/pub/openshift-v4/dependencies/rhcos/4.20/4.20.13/rhcos-4.20.13-x86_64-live-iso.x86_64.iso
      rootFSUrl: https://mirror.openshift.com/pub/openshift-v4/dependencies/rhcos/4.20/4.20.13/rhcos-4.20.13-x86_64-live-rootfs.x86_64.img
