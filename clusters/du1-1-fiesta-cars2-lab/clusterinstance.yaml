---
# InfraEnv for discovery ISO generation
apiVersion: agent-install.openshift.io/v1beta1
kind: InfraEnv
metadata:
  name: fiesta
  namespace: du1-1-fiesta-cars2-lab
spec:
  pullSecretRef:
    name: assisted-deployment-pull-secret
  sshAuthorizedKey: "ssh-rsa "
  additionalNTPSources:
    - clock.cars2.lab
    - clock-v6.cars2.lab
  cpuArchitecture: x86_64
  nmStateConfigLabelSelector:
    matchLabels:
      cluster: fiesta

---
# NMStateConfig for network configuration
apiVersion: agent-install.openshift.io/v1beta1
kind: NMStateConfig
metadata:
  name: fiesta-nmstate
  namespace: du1-1-fiesta-cars2-lab
  labels:
    cluster: fiesta
spec:
  config:
    interfaces:
      - name: eno1
        type: ethernet
        state: down
      - name: eno2
        type: ethernet
        state: down
      - name: eno3
        type: ethernet
        state: up
        mac-address: "3c:ec:ef:b6:ce:12"
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: 192.168.38.144
              prefix-length: 26
        ipv6:
          enabled: true
          dhcp: false
          address:
            - ip: 2600:52:7:300::144
              prefix-length: 64
      - name: ens6f0
        type: ethernet
        state: down
      - name: ens6f1
        type: ethernet
        state: down
      - name: ens6f2
        type: ethernet
        state: down
      - name: ens6f3
        type: ethernet
        state: down
    dns-resolver:
      config:
        server:
          - 192.168.38.12
          - 2600:52:7:38::12
    routes:
      config:
        - destination: 0.0.0.0/0
          next-hop-address: 192.168.38.129
          next-hop-interface: eno3
          table-id: 254
        - destination: ::/0
          next-hop-address: 2600:52:7:300::1
          next-hop-interface: eno3
          table-id: 254
  interfaces:
    - name: eno1
      macAddress: "3c:ec:ef:b6:ce:10"
    - name: eno2
      macAddress: "3c:ec:ef:b6:ce:11"
    - name: eno3
      macAddress: "3c:ec:ef:b6:ce:12"
    - name: ens6f0
      macAddress: "50:7c:6f:30:fc:7c"
    - name: ens6f1
      macAddress: "50:7c:6f:30:fc:7d"
    - name: ens6f2
      macAddress: "50:7c:6f:30:fc:7e"
    - name: ens6f3
      macAddress: "50:7c:6f:30:fc:7f"

---
# ClusterInstance - Main cluster definition
apiVersion: siteconfig.open-cluster-management.io/v1alpha1
kind: ClusterInstance
metadata:
  name: fiesta
  namespace: du1-1-fiesta-cars2-lab
  labels:
    cluster: fiesta
    site: cars2-lab
spec:
  clusterName: fiesta
  pullSecretRef:
    name: assisted-deployment-pull-secret
  clusterImageSetNameRef: img4.18.23-x86-64-appsub
  sshPublicKey: "ssh-rsa "
  baseDomain: cars2.lab

  # NTP configuration
  additionalNTPSources:
    - clock.cars2.lab
    - clock-v6.cars2.lab

  # Network configuration
  machineNetwork:
    - cidr: 192.168.38.128/26
    - cidr: 2600:52:7:300::0/64

  clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23
    - cidr: fd01::/48
      hostPrefix: 64

  serviceNetwork:
    - cidr: 172.30.0.0/16
    - cidr: fd02::/112

  networkType: OVNKubernetes

  # Install config overrides for minimal capabilities
  installConfigOverrides: '{"capabilities":{"baselineCapabilitySet": "None", "additionalEnabledCapabilities": [ "marketplace", "OperatorLifecycleManager", "NodeTuning", "Ingress" ] }}'

  # Workload partitioning
  cpuPartitioningMode: AllNodes

  # Architecture
  cpuArchitecture: x86_64

  # Extra manifests - will be populated from ConfigMap
  extraManifestsRefs:
    - name: extra-manifests

  # Cluster-level templates - required by API
  templateRefs:
    - name: ai-cluster-templates-v1
      namespace: open-cluster-management

  # Node configuration
  nodes:
    - hostName: du1-1.fiesta.cars2.lab
      role: master

      # Node-level templates - required by API
      templateRefs:
        - name: ai-node-templates-v1
          namespace: open-cluster-management

      # BMC configuration
      bmcAddress: redfish-virtualmedia://192.168.38.199/redfish/v1/Systems/1/
      bmcCredentialsName:
        name: gnb-fiesta-cars2-lab-bmc-secret
      bootMACAddress: "3c:ec:ef:b6:ce:12"
      bootMode: UEFI

      # Disk configuration
      rootDeviceHints:
        wwn: "0x500a075138277708"

      # Network interfaces
      nodeNetwork:
        interfaces:
          - name: eno1
            macAddress: "3c:ec:ef:b6:ce:10"
          - name: eno2
            macAddress: "3c:ec:ef:b6:ce:11"
          - name: eno3
            macAddress: "3c:ec:ef:b6:ce:12"
          - name: ens6f0
            macAddress: "50:7c:6f:30:fc:7c"
          - name: ens6f1
            macAddress: "50:7c:6f:30:fc:7d"
          - name: ens6f2
            macAddress: "50:7c:6f:30:fc:7e"
          - name: ens6f3
            macAddress: "50:7c:6f:30:fc:7f"

        # Network configuration
        config:
          interfaces:
            - name: eno1
              type: ethernet
              state: down
            - name: eno2
              type: ethernet
              state: down
            - name: eno3
              type: ethernet
              state: up
              ipv4:
                enabled: true
                dhcp: false
                address:
                  - ip: 192.168.38.144
                    prefix-length: 26
              ipv6:
                enabled: true
                dhcp: false
                address:
                  - ip: 2600:52:7:300::144
                    prefix-length: 64
            - name: ens6f0
              type: ethernet
              state: down
            - name: ens6f1
              type: ethernet
              state: down
            - name: ens6f2
              type: ethernet
              state: down
            - name: ens6f3
              type: ethernet
              state: down

          dns-resolver:
            config:
              server:
                - 192.168.38.12
                - 2600:52:7:38::12

          routes:
            config:
              - destination: 0.0.0.0/0
                next-hop-address: 192.168.38.129
                next-hop-interface: eno3
                table-id: 254
              - destination: ::/0
                next-hop-address: 2600:52:7:300::1
                next-hop-interface: eno3
                table-id: 254
