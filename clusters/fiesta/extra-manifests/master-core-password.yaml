---
# MachineConfig to set core user password
# This allows console login for troubleshooting
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: 99-master-core-password
spec:
  config:
    ignition:
      version: 3.2.0
    passwd:
      users:
        - name: core
          # Password hash for "redhat" (generated with: openssl passwd -6 redhat)
          # Change this to your desired password hash
          passwordHash: "$6$rounds=10000$SALT$HASH"
